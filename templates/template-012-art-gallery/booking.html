<div class="content">

<section class="sec" style="padding-top:60px">
  <div class="wrap" style="max-width:860px">
    <p class="kicker">RESERVE A VISIT</p>
    <h1 style="font-size:clamp(34px,5vw,56px);margin:0 0 18px">預約參觀</h1>
    <p class="lead">請選擇您偏好的時段，我們將以電子郵件回覆確認。</p>
    <div class="form" style="margin-top:30px">
      <form data-fake="✓ 預約申請已送出！我們將於 24 小時內以 Email 確認導覽時段與地點。">
        <div class="grid2">
          <div><label for="bk-name">姓名 *</label><input id="bk-name" type="text" placeholder="張小姐" required></div>
          <div><label for="bk-email">電子信箱 *</label><input id="bk-email" type="email" placeholder="guest@example.com" required></div>
        </div>
        <div class="grid2">
          <div><label for="bk-date">參觀日期 *</label><input id="bk-date" type="date" required></div>
          <div><label for="bk-time">希望時段 *</label><select id="bk-time"><option>11:30 早場導覽</option><option>14:00 午後導覽</option><option>17:00 暮光導覽</option></select></div>
        </div>
        <div class="grid2">
          <div><label for="bk-people">人數</label><select id="bk-people"><option>1 人</option><option>2 人</option><option>3–5 人</option><option>6 人以上團體</option></select></div>
          <div><label for="bk-guide">導覽方式</label><select id="bk-guide"><option>策展人親自導覽（每週六限定）</option><option>專人一般導覽</option><option>自由參觀</option></select></div>
        </div>
        <div><label for="bk-note">想深入了解的主題或作品</label><textarea id="bk-note" rows="3" placeholder="例：想了解新媒體裝置的創作脈絡…"></textarea></div>
        <button class="btn" type="submit">送出預約</button>
        <p class="msg" aria-live="polite" style="font-size:16px;text-align:center"></p>
      </form>
    </div>
  </div>
</section>
